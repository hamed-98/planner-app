version: '3.8'

services:
  sayeban-postgres:
    image: postgres:16-alpine
    container_name: sayeban-db-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: sayeban_user
      POSTGRES_PASSWORD: sayeban_password123
      POSTGRES_DB: sayeban_db
    ports:
      - "5433:5432"
    volumes:
      - sayeban_pgdata:/var/lib/postgresql/data

volumes:
  sayeban_pgdata:
    name: sayeban_data_volume